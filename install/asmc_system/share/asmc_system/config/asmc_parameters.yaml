asmc_system:
  ros__parameters:
    
    # ======================================================================
    # CONTROL MODE
    # ======================================================================
    # false = PID Only (Position -> Velocity -> Attitude -> Body Rates)
    # true  = ASMC (Position -> Velocity -> Attitude -> Torque)
    enable_asmc: true
    
    # position_kp_xy: 1.5 #1.2
    # position_kp_z: 1.75  #2.0
    # position_ki_xy: 0.0  #0.15
    # position_ki_z:  0.0  #0.2
    
    # velocity_kp_xy: 3.0 #0.6  #1.0
    # velocity_ki_xy: 0.5  #0.08  #0.15
    # velocity_kd_xy: 0.1   #0.3
    
    # velocity_kp_z: 3.0   #1.5
    # velocity_ki_z: 0.5  #0.2
    # velocity_kd_z: 0.1   #0.25
 
    # attitude_kp_roll: 2.0  #6.0
    # attitude_ki_roll: 0.0  #0.3
    # attitude_kd_roll: 0.0  #0.2
    
    # attitude_kp_pitch: 2.0  #6.0
    # attitude_ki_pitch: 0.0   #0.3
    # attitude_kd_pitch: 0.0  #0.2
    
    # attitude_kp_yaw: 2.0  #3.0
    # attitude_ki_yaw: 0.0  #0.2
    # attitude_kd_yaw: 0.0  #0.15
    # ======================================================================
    # OUTER LOOP: POSITION → VELOCITY (P Controller)
    # ======================================================================
    position_kp_xy: 0.35 #1.2
    position_kp_z: 1.2  #2.0
    position_ki_xy: 0.0  #0.15
    position_ki_z:  0.0  #0.2
    
    # ======================================================================
    # MIDDLE LOOP: VELOCITY → ATTITUDE + THRUST (PID Controller)
    # ======================================================================
    # This loop generates the Attitude Setpoint (q_des) and Collective Thrust
    velocity_kp_xy: 0.6 #0.6  #1.0
    velocity_ki_xy: 0.2  #0.08  #0.15
    velocity_kd_xy: 0.0   #0.3
    
    velocity_kp_z: 0.8   #1.5
    velocity_ki_z: 0.10   #0.2
    velocity_kd_z: 0.0   #0.25
    
    # ======================================================================
    # INNER LOOP: ATTITUDE → RATE (P/PID Controller)
    # ======================================================================
    # This generates the "Desired Angular Velocity" (Feedforward) for ASMC
    # or the actual Body Rate setpoint for PID-only mode.
    
    # High P gains here ensure we track the attitude command closely
    # before passing it to the ASMC or Rate controller.
    
    attitude_kp_roll: 0.5  #6.0
    attitude_ki_roll: 0.0  #0.3
    attitude_kd_roll: 0.0  #0.2
    
    attitude_kp_pitch: 0.5  #6.0
    attitude_ki_pitch: 0.0   #0.3
    attitude_kd_pitch: 0.0  #0.2
    
    attitude_kp_yaw: 0.0  #3.0
    attitude_ki_yaw: 0.0  #0.2
    attitude_kd_yaw: 0.0  #0.15
    
    # ======================================================================
    # NOTE ON ASMC GAINS
    # ======================================================================
    # The ASMC gains (Lam, Phi, Alpha, etc.) are currently defined 
    # inside the ASMC class constructor (asmc.hpp) matching the Python script.
    # To tune them without recompiling, they should be added here and 
    # read in asmc_system_refactored.cpp in the future.