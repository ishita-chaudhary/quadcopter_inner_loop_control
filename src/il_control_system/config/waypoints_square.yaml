# Example waypoints file for trajectory_planner
# Coordinates are in NED frame (North-East-Down)
# Z negative = up, Z positive = down

waypoints:
  # Square pattern at 5m altitude
  - name: "Takeoff"
    x: 0.0
    y: 0.0
    z: -3.5    # 5m up

  - name: "North side"
    x: 5.0
    y: 0.0
    z: -5.0

  - name: "Northeast corner"
    x: 5.0
    y: 5.0
    z: -5.0

  - name: "Northwest corner"
    x: 0.0
    y: 5.0
    z: -5.0

  - name: "Return home"
    x: 0.0
    y: 0.0
    z: -5.0

  - name: "Descend"
    x: 0.0
    y: 0.0
    z: -1.0    # 1m up for landing
