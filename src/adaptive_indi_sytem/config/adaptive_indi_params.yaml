#     attitude_ki_yaw: 0.2
#     attitude_kd_yaw: 0.15
    
#     # ======================================================================
#     # RATE CONTROLLER (for INDI mode)
#     # ======================================================================
#     rate_kp: 2.5
#     rate_kd: 0.08





# ==============================================================================
# FILTER TUNING GUIDE
# ==============================================================================
#
# The INDI filter cutoff frequency is THE MOST CRITICAL parameter for INDI
# stability. It affects both gyro differentiation and motor measurements.
#
# SYMPTOMS vs FILTER CUTOFF:
#
# Cutoff TOO LOW (< 20 Hz):
#   - Symptoms: Sluggish response, large phase lag
#   - Motors: Over-filtered, delayed state
#   - Gyro: Over-filtered, delayed acceleration
#   - Result: Controller "fighting yesterday's error"
#
# Cutoff TOO HIGH (> 80 Hz):
#   - Symptoms: High-frequency oscillations, "violent jumping"
#   - Motors: Noisy measurements amplified
#   - Gyro: Noisy acceleration signal
#   - Result: INDI amplifies noise, unstable
#
# Cutoff JUST RIGHT (30-50 Hz):
#   - Symptoms: Smooth, responsive control
#   - Motors: Clean state estimation
#   - Gyro: Clean acceleration signal
#   - Result: Stable INDI control
#
# TUNING PROCEDURE:
#
# 1. Start conservative: indi_filter_cutoff_hz: 20.0
# 2. Test hover stability
# 3. If stable but sluggish: increase by 5 Hz
# 4. Repeat until you see small oscillations
# 5. Back off by 10 Hz for safety margin
# 6. Typical sweet spot: 25-40 Hz
#
# ADVANCED TUNING:
#
# For different control loop rates:
# - 100 Hz loop: Use 15-25 Hz cutoff
# - 250 Hz loop: Use 25-40 Hz cutoff
# - 500 Hz loop: Use 40-80 Hz cutoff
#
# Rule of thumb: Cutoff ≈ 10-20% of sample rate
#
# ==============================================================================


    # # PID CONTROLLER GAINS - CASCADE TUNING
    # # ======================================================================
    
    # # Position Controller (P and I gains)
    # # Controls position error -> velocity commands
    # # Kp: How aggressively to reduce position error
    # # Ki: How much to accumulate past error (prevents steady-state error)
    # position_kp_xy: 0.35    # Horizontal proportional
    # position_ki_xy: 0.15   # Horizontal integral (anti-windup at 1.0 m)
    # position_kp_z:  1.2    # Vertical proportional
    # position_ki_z:  0.20   # Vertical integral (anti-windup at 0.5 m)
    
    # # Velocity Controller (P and I gains)
    # # Controls velocity error -> attitude/thrust commands
    # # Kp: How aggressively to reduce velocity error
    # # Ki: Corrects for bias/model mismatch
    # velocity_kp_xy: 0.6    # Horizontal proportional
    # velocity_ki_xy: 0.08   # Horizontal integral (prevents drift)
    # velocity_kp_z:  0.8    # Vertical proportional
    # velocity_ki_z:  0.10   # Vertical integral (prevents altitude drift)
    
    # # Attitude Controller (P gain only)
    # # Controls attitude error -> rate commands
    # attitude_kp_roll:  0.5  # Roll proportional
    # attitude_kp_pitch: 0.5  # Pitch proportional
    # attitude_kp_yaw:   0.0  # Yaw proportional
    
    # # Rate Controller (P and D gains)
    # # Controls rate error -> acceleration commands (feeds INDI)
    # # Kp: How aggressively to reduce rate error
    # # Kd: Damping to prevent overshoot (improves stability)
    # rate_kp: 2.5   # Proportional gain (faster correction)
    # rate_kd: 0.08  # Derivative gain (damping, prevents oscillation)
    
    # # Learning Rates - DISABLED for initial testing
    # # Set to very small values to effectively disable adaptation
    # learning_rate_mu1: 0.0001
    # learning_rate_mu2: 0.001
    
    # # Disable adaptation until stable flight confirmed
    # enable_adaptation: false