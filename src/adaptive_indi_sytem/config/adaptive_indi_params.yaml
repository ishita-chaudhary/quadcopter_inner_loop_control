adaptive_indi_system:
  ros__parameters:
    
    # ======================================================================
    # CONFIG FOR PX4 GAZEBO X500 MODEL
    # ======================================================================
    # These values match the PX4 x500 airframe exactly
    
    # ======================================================================
    # CONTROL MODE - START WITH PID-ONLY!
    # ======================================================================
    enable_indi: true        # Test PID-only first!
    enable_adaptation: true
    
    # ======================================================================
    # INDI FILTERS
    # ======================================================================
    indi_filter_cutoff_hz: 30.0   # Conservative
    indi_sample_rate_hz: 250.0
    
    # ======================================================================
    # PHYSICAL PARAMETERS - EXACT FROM PX4 X500 AIRFRAME
    # ======================================================================
    # These MUST match your drone model!
    
    # ixx: 0.029125              # PX4 default for x500
    # iyy: 0.029125
    # izz: 0.055225
    
    # # From CA_ROTORx_PX/PY parameters:
    # arm_length_x: 0.13         # ✅ CA_ROTOR0_PX (was 0.17 - WRONG!)
    # arm_length_y: 0.21         # ✅ Average of PY (was 0.17 - WRONG!)
    
    # k1_thrust: 0.00001         # Thrust coefficient
    # k2_yaw: 0.00001            # Yaw coefficient
    # rotor_inertia: 0.00005
    
    # # From MPC_THR_HOVER parameter:
    # hover_thrust: 0.70         # ✅ Matches PX4 (was 0.70 - WRONG!)



    ixx: 0.020
    iyy: 0.020
    izz: 0.040
    arm_length_x: 0.17
    arm_length_y: 0.17
    k1_thrust: 0.000030
    k2_yaw: 0.000030
    rotor_inertia: 0.00009
    hover_thrust: 0.60
    
    learning_rate_mu1: 0.0001
    learning_rate_mu2: 0.001
    
    # ======================================================================
    # ULTRA-CONSERVATIVE PID GAINS FOR TESTING
    # ======================================================================
    # Start very low - increase gradually if stable
    
    # # OUTER LOOP: Position → Velocity (P only)
    # position_kp_xy: 0.5
    # position_kp_z: 0.8
    
    # # MIDDLE LOOP: Velocity → Attitude + Thrust (PID)
    # velocity_kp_xy: 0.4
    # velocity_ki_xy: 0.0        # Zero for initial testing
    # velocity_kd_xy: 0.1
    
    # velocity_kp_z: 0.6
    # velocity_ki_z: 0.0         # Zero for initial testing
    # velocity_kd_z: 0.1
    
    # # INNER LOOP: Attitude → Rate (PID)
    # attitude_kp_roll: 2.0      # Very conservative
    # attitude_ki_roll: 0.0      # Zero for initial testing
    # attitude_kd_roll: 0.05
    
    # attitude_kp_pitch: 2.0
    # attitude_ki_pitch: 0.0
    # attitude_kd_pitch: 0.05
    
    # attitude_kp_yaw: 1.0
    # attitude_ki_yaw: 0.0
    # attitude_kd_yaw: 0.05
    
    # # RATE CONTROLLER (for INDI mode)
    # rate_kp: 1.5
    # rate_kd: 0.05



    position_kp_xy: 1.2
    position_kp_z: 2.0
    
    # ======================================================================
    # MIDDLE LOOP: VELOCITY → ATTITUDE + THRUST (PID)
    # ======================================================================
    velocity_kp_xy: 1.0
    velocity_ki_xy: 0.15
    velocity_kd_xy: 0.3
    
    velocity_kp_z: 1.5
    velocity_ki_z: 0.2
    velocity_kd_z: 0.25
    
    # ======================================================================
    # INNER LOOP: ATTITUDE → RATE (PID)
    # ======================================================================
    attitude_kp_roll: 6.0
    attitude_ki_roll: 0.3
    attitude_kd_roll: 0.2
    
    attitude_kp_pitch: 6.0
    attitude_ki_pitch: 0.3
    attitude_kd_pitch: 0.2
    
    attitude_kp_yaw: 3.0
    attitude_ki_yaw: 0.2
    attitude_kd_yaw: 0.15
    
    # ======================================================================
    # RATE CONTROLLER (for INDI mode)
    # ======================================================================
    rate_kp: 2.5
    rate_kd: 0.08




# ==============================================================================
# FRAME VERIFICATION FOR X500
# ==============================================================================
#
# Your x500 frame layout (from PX4 params):
#
#       Front
#    2(CW)  0(CCW)
#       \ /
#        X
#       / \
#    1(CCW) 3(CW)
#       Back
#
# Motor 0: Front-Right (PX=+0.13, PY=+0.22) - Spins CCW
# Motor 1: Back-Left (PX=-0.13, PY=-0.20) - Spins CCW
# Motor 2: Front-Left (PX=+0.13, PY=-0.22) - Spins CW
# Motor 3: Back-Right (PX=-0.13, PY=+0.20) - Spins CW
#
# Expected B matrix (in indi_proper.hpp):
#
# Roll  [-, +, +, -]  (Left motors +, Right motors -)
# Pitch [+, -, +, -]  (Front motors +, Back motors -)
# Yaw   [+, +, -, -]  (CCW motors +, CW motors -)
#
# This is the STANDARD PX4 X-frame - my production code is correct!
#
# ==============================================================================


# ==============================================================================
# TESTING PROCEDURE
# ==============================================================================
#
# STEP 1: Verify you have NEW code
# ─────────────────────────────────
# Check this line in indi_proper.hpp:
#   float max_increment = 0.02f;  // Should be 0.02, NOT 0.05!
#
# If it's 0.05 → You have OLD code → Replace files first!
#
# STEP 2: Test PID-only mode (enable_indi: false)
# ─────────────────────────────────────────────────
# 1. Launch SITL + Gazebo
# 2. Launch your ROS2 system
# 3. Takeoff to 1m in offboard mode
# 4. Observe for 30 seconds:
#    - Position error < 0.5m
#    - No oscillations
#    - Stable hover
#
# If UNSTABLE:
#   → Reduce attitude_kp to 1.5
#   → Reduce velocity_kp to 0.3
#   → Try again
#
# If FLIPS immediately:
#   → Frame is wrong (shouldn't happen with x500)
#   → Check B matrix signs
#
# STEP 3: Enable INDI (only after Step 2 is stable!)
# ────────────────────────────────────────────────────
# 1. Set enable_indi: true
# 2. Relaunch system
# 3. Observe logs for:
#    - AngAccel < 20 rad/s²
#    - Motor_incr < 0.01
#    - Motors 0.55-0.65 (around hover)
#
# ==============================================================================


# ==============================================================================
# TROUBLESHOOTING YOUR LOGS
# ==============================================================================
#
# Your logs showed:
#
# ❌ Motor_incr: [-0.0500, 0.0500, ...]  
#    → This means max_increment = 0.05 (OLD CODE!)
#    → Should be 0.02 in NEW code
#
# ❌ AngAccel: [263.0 rad/s²]
#    → Should be < 20 rad/s²
#    → Indicates positive feedback (wrong frame OR old code)
#
# ❌ Motors: [0.000, 1.000]
#    → Completely saturated
#    → Controller unstable
#
# ❌ Position: -25.86m
#    → Diverging
#    → Not flying, crashing!
#
# ROOT CAUSES:
# 1. You're using OLD code (check max_increment value!)
# 2. Wrong physical parameters (arm_length, hover_thrust)
# 3. Possibly PID gains too high
#
# SOLUTION:
# 1. Verify you have NEW code files
# 2. Update this config (arm_length, hover_thrust)
# 3. Start with PID-only mode
# 4. Use these conservative gains
#
# ==============================================================================











# adaptive_indi_system:
#   ros__parameters:
    
#     # ======================================================================
#     # CONTROL MODE
#     # ======================================================================
#     enable_indi: true        # false = PID-only, true = PID + INDI
#     enable_adaptation: false  # false = fixed gains, true = adaptive
    
#     # ======================================================================
#     # INDI FILTER PARAMETERS - CRITICAL FOR STABILITY!
#     # ======================================================================
#     # These filters ensure synchronization between gyro differentiation and
#     # motor measurements. MUST use same cutoff frequency for both!
#     #
#     # Cutoff frequency guidelines:
#     # - 20-30 Hz: Conservative, smoother but slower response
#     # - 30-50 Hz: Balanced, good for most applications
#     # - 50-80 Hz: Aggressive, faster but may amplify noise
#     #
#     # Sample rate MUST match your control loop frequency (250 Hz)
    
#     indi_filter_cutoff_hz: 30.0   # 30 Hz - conservative and stable
#     indi_sample_rate_hz: 250.0    # Must match control loop rate (4ms = 250Hz)
    
#     # ======================================================================
#     # PHYSICAL PARAMETERS
#     # ======================================================================
#     ixx: 0.020
#     iyy: 0.020
#     izz: 0.040
#     arm_length_x: 0.17
#     arm_length_y: 0.17
#     k1_thrust: 0.000030
#     k2_yaw: 0.000030
#     rotor_inertia: 0.00009
#     hover_thrust: 0.70
    
#     learning_rate_mu1: 0.0001
#     learning_rate_mu2: 0.001
    
#     # ======================================================================
#     # OUTER LOOP: POSITION → VELOCITY (P only)
#     # ======================================================================
#     position_kp_xy: 1.2
#     position_kp_z: 2.0
    
#     # ======================================================================
#     # MIDDLE LOOP: VELOCITY → ATTITUDE + THRUST (PID)
#     # ======================================================================
#     velocity_kp_xy: 1.0
#     velocity_ki_xy: 0.15
#     velocity_kd_xy: 0.3
    
#     velocity_kp_z: 1.5
#     velocity_ki_z: 0.2
#     velocity_kd_z: 0.25
    
#     # ======================================================================
#     # INNER LOOP: ATTITUDE → RATE (PID)
#     # ======================================================================
#     attitude_kp_roll: 6.0
#     attitude_ki_roll: 0.3
#     attitude_kd_roll: 0.2
    
#     attitude_kp_pitch: 6.0
#     attitude_ki_pitch: 0.3
#     attitude_kd_pitch: 0.2
    
